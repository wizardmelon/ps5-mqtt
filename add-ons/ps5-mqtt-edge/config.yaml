version: "1.5.1-dev1"
slug: ps5_mqtt_dev
name: PS5 MQTT - Development Version (fork, WIP)
description: >-
  UNRELEASED development build from a personal fork, currently testing PSN
  token persistence. Not supported, not recommended for general use — may
  break or change without notice.
url: https://github.com/wizardmelon/ps5-mqtt/tree/main/add-ons/ps5-mqtt-edge
arch:
  - aarch64
  - amd64
startup: application
services:
  - "mqtt:need"
boot: auto
host_network: true
ingress: true
ingress_port: 0
panel_icon: "mdi:sony-playstation"
ports:
  8645/tcp: null
ports_description:
  8645/tcp: PS5 MQTT Web Interface
map:
  - "config:rw"
options:
  mqtt: {}
  logger: "@ha:ps5:*"
  device_check_interval: 5000
  device_discovery_interval: 60000
  account_check_interval: 5000
  include_ps4_devices: false
  psn_accounts: []
schema:
  mqtt:
    host: str?
    port: port?
    user: str?
    pass: str?
    discovery_topic: str?
  psn_accounts:
    - username: str?
      npsso: str
      preferred_ps5: str?
      preferred_ps4: str?
  logger: str?
  device_discovery_broadcast_address: str?
  device_check_interval: int
  device_discovery_interval: int
  account_check_interval: int
  include_ps4_devices: bool
  login_passcode: str?
stdin: true
image: "ghcr.io/wizardmelon/ps5-mqtt-home-assistant-add-on"
